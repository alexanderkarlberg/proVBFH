name: CI

# Build all three programs against the latest releases of hoppet, LHAPDF
# and FastJet, and run short smoke tests. The weekly run catches
# breakage caused by new dependency releases.

on:
  push:
    paths-ignore: ['notes/**', 'releases/**', '**.md']
  pull_request:
    paths-ignore: ['notes/**', 'releases/**', '**.md']
  schedule:
    - cron: '0 5 * * 1'    # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      hoppet:
        description: 'hoppet version (empty: latest release)'
        required: false
      lhapdf:
        description: 'LHAPDF version (empty: latest release)'
        required: false
      fastjet:
        description: 'FastJet version (empty: latest release)'
        required: false

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      hoppet: ${{ steps.resolve.outputs.hoppet }}
      lhapdf: ${{ steps.resolve.outputs.lhapdf }}
      fastjet: ${{ steps.resolve.outputs.fastjet }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HOPPET_VERSION: ${{ inputs.hoppet }}
          LHAPDF_VERSION: ${{ inputs.lhapdf }}
          FASTJET_VERSION: ${{ inputs.fastjet }}
        run: |
          versions=$(ci/resolve-versions.sh)
          echo "$versions" | tee -a "$GITHUB_OUTPUT"
          { echo "### Dependency versions"; echo "$versions" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"

  build-and-run:
    needs: versions
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      HOPPET_VERSION: ${{ needs.versions.outputs.hoppet }}
      LHAPDF_VERSION: ${{ needs.versions.outputs.lhapdf }}
      FASTJET_VERSION: ${{ needs.versions.outputs.fastjet }}
      PREFIX: ${{ github.workspace }}/../deps
      RUNROOT: ${{ github.workspace }}/../ci-runs
    steps:
      - uses: actions/checkout@v5

      - name: Install compilers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install compilers (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Compiler versions
        id: compiler
        run: |
          gfortran --version | head -1
          c++ --version | head -1
          # gfortran .mod files are not compatible across major versions,
          # so the major version goes into the dependency cache key
          echo "gfortran=$(gfortran -dumpversion | cut -d. -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: deps-${{ runner.os }}-${{ runner.arch }}-gfortran${{ steps.compiler.outputs.gfortran }}-hoppet${{ env.HOPPET_VERSION }}-lhapdf${{ env.LHAPDF_VERSION }}-fastjet${{ env.FASTJET_VERSION }}-${{ hashFiles('ci/install-deps.sh') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/install-deps.sh

      - name: Set up environment
        id: env
        run: |
          PREFIX=$(cd "$PREFIX" && pwd)
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNROOT"

      # Each package is built and tested independently, so a failure in
      # one does not hide the status of the others.
      - name: Build proVBFH-inclusive
        id: build-incl
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        working-directory: proVBFH-inclusive
        run: ./configure && make

      - name: Smoke tests proVBFH-inclusive
        if: ${{ !cancelled() && steps.build-incl.outcome == 'success' }}
        run: ci/smoke-tests.sh proVBFH-inclusive

      - name: Tensor checks
        if: ${{ !cancelled() && steps.build-incl.outcome == 'success' }}
        run: ci/tensor-checks.sh

      - name: Build proVBFH
        id: build-h
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        working-directory: proVBFH
        run: ./configure && make

      - name: Smoke tests proVBFH
        if: ${{ !cancelled() && steps.build-h.outcome == 'success' }}
        run: ci/smoke-tests.sh proVBFH

      - name: Build proVBFHH
        id: build-hh
        if: ${{ !cancelled() && steps.env.outcome == 'success' }}
        working-directory: proVBFHH
        run: ./configure && make

      - name: Smoke tests proVBFHH
        if: ${{ !cancelled() && steps.build-hh.outcome == 'success' }}
        run: ci/smoke-tests.sh proVBFHH

      - name: Upload run directories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.os }}
          path: ${{ env.RUNROOT }}
          retention-days: 14

  # GitHub disables scheduled workflows in public repositories after 60
  # days without repository activity. Re-enabling the workflow through
  # the API on every scheduled run resets that timer.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ci.yml/enable"
